name: Deploy API Docs
on:
  push:
    branches: [main]
    paths:
      - apollo-openapi.yaml
      - redocly.yaml
      - scripts/build-docs.sh
      - scripts/verify-docs.py
      - package.json
      - package-lock.json
      - .github/workflows/deploy-docs.yml
  workflow_dispatch:
    inputs:
      expected_tag:
        description: Release tag that must be present in the published site
        required: false
        type: string

permissions:
  contents: read

env:
  DOCS_URL: https://openapi.apolloconfig.com

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      source_sha: ${{ steps.expected.outputs.source_sha }}
      checks: ${{ steps.expected.outputs.checks }}
    steps:
      # Build next from main and released versions from their tags.
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
      - id: docs
        run: ./scripts/build-docs.sh
      - name: Record expected published content
        id: expected
        env:
          LATEST_TAG: ${{ steps.docs.outputs.latest_tag }}
          EXPECTED_TAG: ${{ inputs.expected_tag }}
        run: |
          echo "source_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          python3 scripts/verify-docs.py manifest site \
            --version "$LATEST_TAG" --version "$EXPECTED_TAG" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: https://openapi.apolloconfig.com
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.build.outputs.source_sha }}
          persist-credentials: false
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify published content
        env:
          EXPECTED_CHECKS: ${{ needs.build.outputs.checks }}
        run: |
          python3 scripts/verify-docs.py verify \
            --url "$DOCS_URL" --checks "$EXPECTED_CHECKS"
